<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<style>
  /* Toolsmith Console design tokens (console DESIGN.md /
     tokens.css): quiet monochrome surfaces, indigo accent,
     semantic colors reserved for status. */
  :root {
    --canvas: #FAFAFA; --surface: #FFFFFF; --raised: #FFFFFF;
    --hover: #F5F5F5; --line: #E5E5E5; --line-strong: #D4D4D4;
    --fg: #0A0A0A; --muted: #404040; --subtle: #737373; --faint: #A3A3A3;
    --accent: #5E6AD2; --accent-hover: #4F5BC4; --accent-fg: #FFFFFF;
    --success: #2D9D6B; --warning: #C58B0C; --danger: #D93F3F;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #0A0A0A; --surface: #0A0A0A; --raised: #171717;
      --hover: #262626; --line: #262626; --line-strong: #404040;
      --fg: #FAFAFA; --muted: #D4D4D4; --subtle: #A3A3A3; --faint: #737373;
      --accent: #7C86E8; --accent-hover: #5E6AD2; --accent-fg: #FFFFFF;
      --success: #4CB782; --warning: #F2C94C; --danger: #EB5757;
    }
  }

  * { box-sizing: border-box; }
  body {
    font: 13px/1.5 system-ui, sans-serif; width: 300px; margin: 0;
    background: var(--canvas); color: var(--fg); padding: 14px;
  }
  header { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
  header img { width: 28px; height: 28px; border-radius: 7px; }
  header .name { font-size: 14px; font-weight: 600; }
  header .version { color: var(--faint); font-size: 12px; margin-left: auto; }
  .card {
    background: var(--raised); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px;
  }
  .status-row { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.connected { background: var(--success); }
  .dot.error { background: var(--danger); }
  .dot.busy { background: var(--warning); }
  .meta { color: var(--subtle); font-size: 12px; margin-top: 6px; word-break: break-all; }
  .meta .mono { font-family: ui-monospace, monospace; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  button {
    font: 500 13px system-ui, sans-serif; padding: 7px 14px; border-radius: 8px;
    cursor: pointer; border: 1px solid transparent;
  }
  button.primary { background: var(--accent); color: var(--accent-fg); }
  button.primary:hover { background: var(--accent-hover); }
  button.ghost { background: transparent; border-color: var(--line-strong); color: var(--fg); }
  button.ghost:hover { background: var(--hover); }
  button:disabled { opacity: 0.55; cursor: default; }
  footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 12px; color: var(--subtle); font-size: 12px;
  }
  footer button { padding: 4px 8px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <img src="logo.svg" alt="">
  <span class="name">Toolsmith</span>
  <span class="version">0.2.1</span>
</header>

<div class="card">
  <div class="status-row"><span class="dot" id="dot"></span><span id="state">Memeriksa...</span></div>
  <div class="meta" id="meta"></div>
  <div class="actions">
    <button class="primary" id="connect">Connect</button>
    <button class="ghost" id="disconnect" hidden>Putuskan</button>
  </div>
</div>

<footer>
  <span>Di Gemini, pakai tombol Toolsmith di samping tombol +.</span>
  <button class="ghost" id="options">Pengaturan</button>
</footer>

<script src="popup.js"></script>
</body>
</html>
